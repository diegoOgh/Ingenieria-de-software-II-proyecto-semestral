<!DOCTYPE html>
<html lang="es" class="bg-gray-50 text-gray-800">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Woldo | Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style> .hidden { display: none !important; } </style>
</head>
<body class="min-h-screen flex items-center justify-center font-sans antialiased p-4">

    <main class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden">
        <div class="bg-blue-700 p-6 text-center">
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Woldo</h1>
            <p class="text-blue-100 text-sm mt-2">Sistema de Gestión de Convivencia Escolar</p>
        </div>

        <div class="p-8">
            <h2 class="text-xl font-bold text-gray-900 text-center mb-6">Acceso a la plataforma</h2>

            <div id="msg-error" class="hidden mb-4 p-3 bg-red-50 border-l-4 border-red-500 text-red-700 text-sm rounded shadow-sm" role="alert">
                <span class="font-bold">Error:</span> <span id="error-texto">Credenciales inválidas.</span>
            </div>

            <form id="login-form" novalidate class="space-y-5">
                <div class="form-group flex flex-col">
                    <label for="email" class="text-sm font-medium text-gray-700 mb-1">Correo Electrónico Institucional</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="ejemplo@colegio.cl" 
                        required
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg bg-gray-50 text-gray-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
                </div>

                <div class="form-group flex flex-col">
                    <label for="password" class="text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••" 
                        required
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg bg-gray-50 text-gray-900 focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors">
                </div>

                <button type="submit" id="btn-submit" 
                        class="w-full mt-2 px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md transition-colors duration-150 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
                    Ingresar
                </button>
            </form>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            const msgError = document.getElementById('msg-error');
            const errorTexto = document.getElementById('error-texto');

            form.addEventListener('submit', function(event) {
                event.preventDefault();
                msgError.classList.add('hidden');

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value.trim();

                if (!email || !password) {
                    mostrarError('Todos los campos son obligatorios.');
                    return;
                }

                fetch('procesar_login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                })
                .then(res => res.json())
                .then(data => {
                    if (data.exito) {
                        // Redirigir al panel principal tras el login exitoso
                        window.location.href = 'Index.html';
                    } else {
                        mostrarError(data.mensaje);
                    }
                })
                .catch(() => mostrarError('Error al conectar con el servidor.'));
            });

            function mostrarError(mensaje) {
                errorTexto.textContent = mensaje;
                msgError.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
